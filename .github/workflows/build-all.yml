name: Build MH Apps Gallery (Android, Windows, macOS, Web/iPhone)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }
      # iPhone / iPad / Mac: host this folder (e.g. GitHub Pages), open in Safari > Share > Add to Home Screen
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Create Android project
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MH Apps Gallery" com.mhappsgallery.app --web-dir dist
          npx cap add android
          npx cap sync android
      - name: Use the original logo as the app icon
        run: |
          pip install pillow
          python3 tools/make_icons.py public/images/mh-logo.png android/app/src/main/res desktop/build
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Apps-Gallery-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  desktop:
    needs: web
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: desktop/app }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Icons from the original logo
        run: |
          python -m pip install pillow
          python tools/make_icons.py public/images/mh-logo.png android-tmp desktop/build
      - name: Build installer
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          npm install
          npx electron-builder
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Apps-Gallery-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MH-Apps-Gallery-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: webout
      - name: Package the web app (HTML)
        run: |
          cd webout && zip -qr ../out/MH-Apps-Gallery-web.zip . && cd ..
          cp webout/index.html out/MH-Apps-Gallery-app.html
          ls -l webout/index.html
      - name: Publish downloads as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lR out
          [ -f out/app-debug.apk ] && mv out/app-debug.apk out/MH-Apps-Gallery.apk
          gh release create "build-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --title "MH Apps Gallery build ${{ github.run_number }}" \
            --notes "Android APK, Windows EXE and macOS DMG. Catalog is live-synced with mhappsgallery.blogspot.com." \
            --latest
