name: Build MH Apps Gallery (All Platforms)

permissions:
  contents: write

on:
  push:
    branches: [ main, master, flutter-all-platforms ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize native platform runners
        run: |
          flutter create --platforms=android,ios,windows,macos .
          cp -f android_manifest_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mh-apps-gallery-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize Windows runner & build .exe
        run: |
          flutter create --platforms=android,ios,windows,macos .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
      - name: Package Windows Release (.zip)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mh-apps-gallery-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mh-apps-gallery-windows-exe
          path: mh-apps-gallery-windows-x64.zip

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize macOS runner & build .dmg
        run: |
          flutter create --platforms=android,ios,windows,macos .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build macos --release
          mkdir -p dmg_staging
          cp -R build/macos/Build/Products/Release/*.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MH Apps Gallery" -srcfolder dmg_staging -ov -format UDZO mh-apps-gallery-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mh-apps-gallery-macos-dmg
          path: mh-apps-gallery-macos.dmg

  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize iOS runner & build unsigned IPA
        run: |
          flutter create --platforms=android,ios,windows,macos .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mh-apps-gallery-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mh-apps-gallery-ios-ipa
          path: mh-apps-gallery-ios-unsigned.ipa

  release:
    needs: [build_android, build_windows, build_macos, build_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mh-apps-gallery-*
          path: out
          merge-multiple: true
      - name: Publish as GitHub pre-release (does not replace the main download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/app-release.apk out/MH-Apps-Gallery-flutter.apk
          ls -lR out
          gh release create "flutter-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --title "MH Apps Gallery (Flutter) build ${{ github.run_number }}" \
            --notes "Flutter build: Android APK, Windows (zip with .exe), macOS DMG, iOS unsigned IPA." \
            --prerelease --latest=false
