name: mh_apps_gallery
description: MH Apps Gallery - Your Apps & Software Hub
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_html: ^3.0.0-beta.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mh_apps_gallery_original.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/mh_apps_gallery_original.png"
  windows:
    generate: true
    image_path: "assets/brand/mh_apps_gallery_original.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/brand/mh_apps_gallery_original.png"
